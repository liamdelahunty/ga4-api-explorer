<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ report_title }} - {{ property_display_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; margin-bottom: 2rem; }
        .header-section { background: #212529; color: white; padding: 2rem 0; margin-bottom: 2rem; }
        .channel-chip { cursor: pointer; border: 1px solid #dee2e6; border-radius: 20px; padding: 2px 12px; margin: 2px; display: inline-block; font-size: 0.85rem; transition: all 0.2s; background: white; }
        .channel-chip:hover { border-color: #0d6efd; }
        .channel-chip.active { background-color: #0d6efd; color: white; border-color: #0d6efd; }
        .chart-container { height: 500px; position: relative; }
    </style>
</head>
<body>

<div class="header-section">
    <div class="container">
        <h1>{{ report_title }}</h1>
        <p class="lead mb-0">Property: {{ property_display_name }} ({{ property_id }})</p>
        <p>Date Range: {{ date_range }}</p>
    </div>
</div>

<div class="container">
    <div class="card">
        <div class="card-body">
            <div class="row mb-4">
                <div class="col-md-12">
                    <label class="form-label fw-bold">Select Channels to Display:</label>
                    <div id="channelSelector" class="p-2 rounded bg-light" style="max-height: 120px; overflow-y: auto;">
                        {% for channel in channels %}
                        <div class="channel-chip active" data-channel="{{ channel }}">{{ channel }}</div>
                        {% endfor %}
                    </div>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="trafficHourChart"></canvas>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h3>Hourly Data Breakdown</h3>
            <div id="tableContent" class="table-responsive">
                <!-- Table will be injected here -->
            </div>
        </div>
    </div>
    
    {% if explanation_html %}
    <div class="card">
        <div class="card-body">
            <h3>Report Information</h3>
            <div class="explanation-content">
                {{ explanation_html | safe }}
            </div>
        </div>
    </div>
    {% endif %}
</div>

<script>
    const rawData = {{ json_data | safe }};
    const hours = {{ hours | safe }}; // Expected to be ["00", "01", ..., "23"]
    const allChannels = {{ channels | safe }};
    let activeChannels = new Set(allChannels);
    let chart = null;

    const colors = [
        '#0d6efd', '#dc3545', '#198754', '#ffc107', '#0dcaf0', '#6610f2', '#fd7e14', '#20c997', '#e83e8c', '#6f42c1'
    ];

    function updateView() {
        // Update Chips UI
        document.querySelectorAll('.channel-chip').forEach(chip => {
            const chName = chip.getAttribute('data-channel');
            if (activeChannels.has(chName)) {
                chip.classList.add('active');
            } else {
                chip.classList.remove('active');
            }
        });

        // Prepare Chart Datasets
        const datasets = Array.from(activeChannels).map((ch, index) => {
            const dataPoints = hours.map(h => (rawData[h] && rawData[h][ch]) ? Number(rawData[h][ch].sessions) : 0);
            return {
                label: ch,
                data: dataPoints,
                backgroundColor: colors[index % colors.length],
                stack: 'Stack 0',
            };
        });

        const ctx = document.getElementById('trafficHourChart').getContext('2d');
        if (chart) chart.destroy();
        
        chart = new Chart(ctx, {
            type: 'bar',
            data: { labels: hours.map(h => h + ':00'), datasets: datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom' },
                    title: { display: true, text: 'Sessions by Hour' }
                },
                scales: {
                    x: { stacked: true, title: { display: true, text: 'Hour of Day' } },
                    y: { stacked: true, beginAtZero: true, title: { display: true, text: 'Sessions' } }
                }
            }
        });

        // Update Table
        let html = '<table class="table table-striped table-bordered"><thead><tr><th>Hour</th>';
        const displayChannels = Array.from(activeChannels);
        displayChannels.forEach(ch => html += '<th>' + ch + '</th>');
        html += '<th class="table-dark">Total</th></tr></thead><tbody>';

        hours.forEach(h => {
            let hourlyTotal = 0;
            html += `<tr><td class="fw-bold">${h}:00</td>`;
            displayChannels.forEach(ch => {
                const val = (rawData[h] && rawData[h][ch]) ? Number(rawData[h][ch].sessions) : 0;
                hourlyTotal += val;
                html += `<td>${val.toLocaleString()}</td>`;
            });
            html += `<td class="table-dark fw-bold">${hourlyTotal.toLocaleString()}</td></tr>`;
        });
        
        html += '</tbody></table>';
        document.getElementById('tableContent').innerHTML = html;
    }

    // Toggle channel inclusion
    document.querySelectorAll('.channel-chip').forEach(chip => {
        chip.addEventListener('click', function() {
            const chName = this.getAttribute('data-channel');
            if (activeChannels.has(chName)) {
                activeChannels.delete(chName);
            } else {
                activeChannels.add(chName);
            }
            updateView();
        });
    });

    // Initial load
    updateView();
</script>

</body>
</html>
