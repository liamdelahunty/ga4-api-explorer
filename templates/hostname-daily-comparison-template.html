<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ report_title }} - {{ property_display_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        html { height: 100%; }
        body { display: flex; flex-direction: column; min-height: 100vh; background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; margin-bottom: 2rem; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .hostname-chip { cursor: pointer; border: 1px solid #dee2e6; border-radius: 20px; padding: 2px 12px; margin: 2px; display: inline-block; font-size: 0.85rem; transition: all 0.2s; background: white; }
        .hostname-chip:hover { border-color: #0d6efd; }
        .hostname-chip.active { background-color: #0d6efd; color: white; border-color: #0d6efd; }
        
        /* Sticky Hostname Column */
        .table-responsive { overflow-x: auto; max-height: 600px; }
        .sticky-col { 
            position: sticky; 
            left: 0; 
            background-color: white !important; 
            z-index: 5; 
            border-right: 2px solid #dee2e6 !important;
            min-width: 200px;
        }
        .table-striped tbody tr:nth-of-type(odd) .sticky-col {
            background-color: #f9f9f9 !important;
        }
        thead .sticky-col {
            background-color: #f8f9fa !important;
            z-index: 6;
        }
        thead th {
            position: sticky;
            top: 0;
            background-color: #f8f9fa;
            z-index: 4;
        }
        thead th.sticky-col {
            z-index: 7;
        }
    </style>
</head>
<body>

<header class="navbar navbar-expand-lg navbar-light bg-light border-bottom mb-4">
    <div class="container-fluid">
        <div class="d-flex align-items-baseline">
            <h1 class="h3 mb-0 me-4">{{ report_title }}</h1>
            <span class="text-muted me-4">{{ property_display_name }} ({{ property_id }})</span>
            <span class="text-muted me-4">{{ date_range }}</span>
        </div>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="https://github.com/liamdelahunty/ga4-api-explorer" target="_blank">GitHub</a>
                </li>
            </ul>
        </div>
    </div>
</header>

<main class="container-fluid py-4 flex-grow-1">
    <div class="card">
        <div class="card-body">
            <div class="row mb-4">
                <div class="col-md-4 border-end">
                    <label for="metricSelect" class="form-label fw-bold">1. Rank & Default to Top 5:</label>
                    <select id="metricSelect" class="form-select">
                        <option value="sessions" selected>Sessions</option>
                        <option value="users">Active Users</option>
                        <option value="engaged">Engaged Sessions</option>
                    </select>
                </div>
                <div class="col-md-8 px-4">
                    <label class="form-label fw-bold">2. Customise Chart Comparison (Click to toggle):</label>
                    <div id="hostnameSelector" class="p-2 rounded bg-light" style="max-height: 120px; overflow-y: auto;">
                        {% for hostname in hostnames %}
                        <div class="hostname-chip" data-hostname="{{ hostname }}">{{ hostname }}</div>
                        {% endfor %}
                    </div>
                </div>
            </div>
            <div style="height: 500px;">
                <canvas id="dailyTrendChart"></canvas>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <h3>Daily Hostname Performance Data</h3>
            <div id="tableContent" class="table-responsive">
                <!-- Table will be injected here -->
            </div>
        </div>
    </div>

    {% if explanation %}
    <div class="card">
        <div class="card-body">
            <h3>Report Explanation</h3>
            <p>{{ explanation }}</p>
        </div>
    </div>
    {% endif %}
</main>

<footer class="mt-3 bg-light border-top py-4">    
    <div class="container text-center text-secondary">
        <p>
            <a href="https://github.com/liamdelahunty/ga4-api-explorer" target="_blank">Github: ga4-api-explorer</a>
         </p>
    </div>
</footer>

<script>
    const rawData = {{ json_data | safe }};
    const dates = {{ dates | safe }};
    const allHostnames = {{ hostnames | safe }};
    let activeHostnames = new Set();
    let chart = null;

    const metricLabels = {
        sessions: 'Sessions',
        users: 'Active Users',
        engaged: 'Engaged Sessions'
    };

    const colors = [
        '#0d6efd', '#dc3545', '#198754', '#ffc107', '#0dcaf0', '#6610f2', '#fd7e14', '#20c997', '#e83e8c', '#6f42c1'
    ];

    function calculateTotals(metricKey) {
        return allHostnames.map(hn => {
            const total = dates.reduce((sum, d) => {
                const val = (rawData[hn] && rawData[hn][d]) ? Number(rawData[hn][d][metricKey]) : 0;
                return sum + val;
            }, 0);
            return { name: hn, total: total };
        });
    }

    function onMetricChange() {
        const metricKey = document.getElementById('metricSelect').value;
        const totals = calculateTotals(metricKey);
        
        const top5 = totals.sort((a, b) => b.total - a.total).slice(0, 5).map(c => c.name);
        activeHostnames = new Set(top5);
        
        updateView();
    }

    function updateView() {
        const metricKey = document.getElementById('metricSelect').value;
        const allTotals = calculateTotals(metricKey);
        const chartDataList = allTotals.filter(ct => activeHostnames.has(ct.name))
                                         .sort((a, b) => b.total - a.total);
        const tableDataList = [...allTotals].sort((a, b) => b.total - a.total);

        document.querySelectorAll('.hostname-chip').forEach(chip => {
            const hnName = chip.getAttribute('data-hostname');
            chip.classList.toggle('active', activeHostnames.has(hnName));
        });

        const datasets = chartDataList.map((hn, index) => {
            const dataPoints = dates.map(d => (rawData[hn.name] && rawData[hn.name][d]) ? Number(rawData[hn.name][d][metricKey]) : 0);
            return {
                label: hn.name,
                data: dataPoints,
                borderColor: colors[index % colors.length],
                backgroundColor: colors[index % colors.length] + '22',
                fill: false,
                tension: 0.1,
                borderWidth: 2,
                pointRadius: 2
            };
        });

        const ctx = document.getElementById('dailyTrendChart').getContext('2d');
        if (chart) chart.destroy();
        
        chart = new Chart(ctx, {
            type: 'line',
            data: { labels: dates, datasets: datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                scales: {
                    y: { beginAtZero: true, title: { display: true, text: metricLabels[metricKey] } }
                },
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });

        let html = '<table class="table table-striped"><thead><tr><th class="sticky-col">Hostname</th><th>Total</th>';
        dates.forEach(d => html += '<th>' + d.substring(5) + '</th>');
        html += '</tr></thead><tbody>';

        tableDataList.forEach((hn, index) => {
            const chartedIndex = chartDataList.findIndex(c => c.name === hn.name);
            const color = chartedIndex !== -1 ? colors[chartedIndex % colors.length] : '#dee2e6';
            
            html += `<tr>
                <td class="fw-bold sticky-col"><span class="legend-dot" style="background:${color}"></span>${hn.name}</td>
                <td class="table-primary fw-bold">${hn.total.toLocaleString()}</td>`;
            dates.forEach(d => {
                const val = (rawData[hn.name] && rawData[hn.name][d]) ? Number(rawData[hn.name][d][metricKey]) : 0;
                html += `<td>${val.toLocaleString()}</td>`;
            });
            html += '</tr>';
        });

        html += '</tbody></table>';
        document.getElementById('tableContent').innerHTML = html;
    }

    document.querySelectorAll('.hostname-chip').forEach(chip => {
        chip.addEventListener('click', function() {
            const hnName = this.getAttribute('data-hostname');
            if (activeHostnames.has(hnName)) activeHostnames.delete(hnName);
            else activeHostnames.add(hnName);
            updateView();
        });
    });

    document.getElementById('metricSelect').addEventListener('change', onMetricChange);
    onMetricChange();
</script>
</body>
</html>
