<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ report_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        html {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .dataTables_wrapper {
            margin-top: 1.5rem;
        }
        .chart-container {
            max-width: 800px;
            margin: 20px auto;
        }
        .summary-box {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #0d6efd;
        }
    </style>
</head>
<body>    
    <header class="navbar navbar-expand-lg navbar-light bg-light border-bottom mb-4">
        <div class="container-fluid">
            <div class="d-flex align-items-baseline">
                <h1 class="h3 mb-0 me-4">{{ report_title }}</h1>
                <span class="text-muted me-4">{{ property_display_name }}</span>
                <span class="text-muted me-4">{{ date_range }}</span>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="https://github.com/liamdelahunty/ga4-api-explorer" target="_blank">GitHub</a>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container py-4 flex-grow-1">
        
        <div class="row">
            <div class="col-md-7">
                <div class="summary-box h-100">
                    <h3 class="h5 mb-3">Top-Line Summary (Top 250 Pages)</h3>
                    {{ summary_table_html|safe }}
                </div>
            </div>
            <div class="col-md-5">
                <div class="chart-container">
                    <canvas id="comparisonChart"></canvas>
                </div>
            </div>
        </div>

        <div class="mt-4 table-responsive">
            {{ table_html|safe }}
        </div>

        <div class="mt-5 border-top pt-4">
            {{ explanation_html|safe }}
        </div>
    </main>

    <footer class="mt-3 bg-light border-top mt-4 py-4">    
        <div class="container text-center text-secondary">
            <p>
                <a href="https://github.com/liamdelahunty/ga4-api-explorer" target="_blank">Github: ga4-api-explorer</a>
             </p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#reportTable').DataTable({
                "pageLength": 25,
                "order": [[2, "desc"]], // Default sort by Active Users (After)
                "language": {
                    "search": "Filter results:"
                }
            });

            const ctx = document.getElementById('comparisonChart').getContext('2d');
            const data = {{ json_data|safe }};
            
            new Chart(ctx, {
                type: 'bar',
                data: data,
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'top',
                        },
                        title: {
                            display: true,
                            text: 'Acquisition Comparison (Top 250 Pages)'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return value.toLocaleString();
                                }
                            }
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
